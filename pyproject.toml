[project]
name = "omeka2dsp"
version = "1.0.0"
description = "Pipeline and data model for migrating Stadt.Geschichte.Basel data from Omeka S to DaSCH Service Platform"
readme = "README.md"
authors = [
    { name = "Stadt Geschichte Basel", email = "info@stadtgeschichtebasel.ch" }
]
license = { text = "AGPL-3.0-or-later" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.15"
dependencies = [
    "omeka-s-client>=0.1.0,<0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.25.0",
    "typer>=0.12",
]

[project.scripts]
omeka2dsp = "omeka2dsp.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "ruff==0.17.6",
    "ty==0.0.107",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py315"
src = ["src", "test"]

[tool.ruff.lint]
# Keep Ruff's default rules (including RUF100). Do not use lint.select.

[tool.ty.environment]
python-version = "3.15"
extra-paths = ["test"]
